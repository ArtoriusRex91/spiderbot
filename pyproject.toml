[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderbot"
version = "0.1.0"
description = "Pilotage d'une araignée robot Freenove Hexapod depuis Linux, par USB ou wifi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
spiderbot = "spiderbot.commande:main"

[tool.setuptools]
packages = ["spiderbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
